site_name: IUTA Slides
site_description: Reusable IUTA Reveal.js template
site_url: https://ricardo-cunha.github.io/iuta-slides/
use_directory_urls: false
strict: true
theme:
  name: material
  logo: assets/iuta-logo.png
  favicon: assets/iuta-logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - content.code.copy

extra_css:
  - stylesheets/site.css

plugins:
  - search
